<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Atendimentos do Professor — Gerencie solicitações de agendamento de alunos, aprove ou rejeite horários no EduSchedule.">
  <title>Meus Atendimentos — EduSchedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/_common/styles/base.css">
  <link rel="stylesheet" href="../assets/app/styles/app.css">
</head>
<body class="app-body">

  <aside class="loading-shell" data-loading-screen aria-live="polite">
    <span class="brand-mark">EduSchedule</span>
    <span class="loading-bar" aria-hidden="true"></span>
    <p>Carregando atendimentos…</p>
  </aside>

  <section class="panel-layout">
    
    <!-- ── Sidebar ── -->
    <aside class="panel-sidebar" data-sidebar>
      <header class="panel-sidebar-header">
        <a class="brand-mark" href="../../index.html">EduSchedule</a>
      </header>
      <nav class="panel-sidebar-nav" aria-label="Navegação do painel">
        <a class="sidebar-link" href="professor-dashboard.html">
          <span class="link-icon" aria-hidden="true">📊</span>
          <span>Dashboard</span>
        </a>
        <a class="sidebar-link" href="disponibilidades.html">
          <span class="link-icon" aria-hidden="true">📅</span>
          <span>Disponibilidades</span>
        </a>
        <a class="sidebar-link" href="atendimentos.html">
          <span class="link-icon" aria-hidden="true">📋</span>
          <span>Atendimentos</span>
        </a>
        <a class="sidebar-link" href="notificacoes.html">
          <span class="link-icon" aria-hidden="true">🔔</span>
          <span>Notificações</span>
        </a>
        <a class="sidebar-link" href="perfil.html">
          <span class="link-icon" aria-hidden="true">👤</span>
          <span>Meu Perfil</span>
        </a>
      </nav>
      <footer class="sidebar-footer">
        <article class="sidebar-user">
          <span class="avatar avatar-md">AL</span>
          <section class="sidebar-user-info">
            <strong class="sidebar-user-name">Minha conta</strong>
            <span class="sidebar-user-role">Informática / TI</span>
          </section>
        </article>
        <a class="sidebar-link" href="../public/login.html" style="margin-top:var(--space-2);border-top:1px solid var(--color-border);padding-top:var(--space-4);">
          <span class="link-icon" aria-hidden="true">🚪</span>
          <span>Sair</span>
        </a>
      </footer>
    </aside>

    <!-- Overlay sidebar mobile -->
    <div class="sidebar-overlay" data-sidebar-overlay></div>

    <!-- ── Conteúdo do Painel ── -->
    <div class="panel-content">
      
      <!-- Topbar -->
      <header class="panel-topbar">
        <section class="panel-topbar-left">
          <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-expanded="false" aria-label="Menu lateral">☰</button>
          <h1 class="page-title">Atendimentos</h1>
        </section>
        <section class="panel-topbar-right">
          <span class="chip">Período Letivo: 2026/1</span>
        </section>
      </header>

      <!-- Main -->
      <main class="panel-main">
        
        <!-- Filtros por Status (controlados por app.js) -->
        <nav class="tab-list animate-fade-up" data-appointment-filter aria-label="Filtro de atendimentos">
          <button class="tab-btn is-active" data-filter="all" type="button">Todos</button>
          <button class="tab-btn" data-filter="pending" type="button">Pendentes</button>
          <button class="tab-btn" data-filter="approved" type="button">Aprovados</button>
          <button class="tab-btn" data-filter="completed" type="button">Concluídos</button>
        </nav>

        <!-- Lista de Atendimentos (controlada por app.js) -->
        <section class="animate-fade-up delay-1">
          <ul class="appointment-list" data-appointment-list aria-label="Lista de atendimentos"><li class="appointment-empty" aria-live="polite">Carregando os atendimentos…</li></ul>
        </section>

      </main>

    </div>
  </section>

  <script src="../assets/_common/scripts/ui.js"></script>
  <script type="module" src="../assets/app/scripts/app.js"></script>
  <script type="module" src="../assets/_common/scripts/guard.js"></script>
  
</body>
</html>
